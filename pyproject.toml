[project]
name = "projet-2"
version = "0.1.0"
description = "Analysez les données de systèmes éducatifs"
readme = "README.md"
authors = [
    { name = "PSouttre", email = "peggy.souttre@free.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
]

[project.scripts]
projet-2 = "projet_2:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
